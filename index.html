<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Revu Quote Builder</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/print.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">Revu Quote Builder</div>
      <div class="current" id="current-quote"></div>
      <div class="topbar-actions">
        <button type="button" id="btn-new">New quote</button>
        <button type="button" id="btn-open">Open quote…</button>
        <button type="button" id="btn-save" class="primary">Save quote</button>
        <input type="file" id="file-open-quote" accept=".json,application/json" hidden>
      </div>
    </header>

    <nav class="tabs" id="tabs" role="tablist">
      <button type="button" role="tab" data-tab="import">1. Import</button>
      <button type="button" role="tab" data-tab="pricing">2. Pricing</button>
      <button type="button" role="tab" data-tab="quote">3. Quote</button>
      <button type="button" role="tab" data-tab="settings">Settings</button>
    </nav>

    <main>
      <section class="panel" id="panel-import" data-panel="import"></section>
      <section class="panel" id="panel-pricing" data-panel="pricing"></section>
      <section class="panel" id="panel-quote" data-panel="quote"></section>
      <section class="panel" id="panel-settings" data-panel="settings"></section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <!-- Filled just before window.print(); only this is visible on paper. -->
  <div id="print-root"></div>

  <script src="lib/papaparse.min.js"></script>
  <script src="data/defaults.js"></script>
  <script src="js/units.js"></script>
  <script src="js/parse.js"></script>
  <script src="js/pricing.js"></script>
  <script src="js/quote.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/xlsx.js"></script>
  <script src="js/pricelist.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
